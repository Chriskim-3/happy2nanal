<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy2Nanal</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tailwind CSS 기본 설정 및 커스텀 폰트 */
        @layer base {
            body {
                font-family: 'Noto Sans KR', sans-serif;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-white shadow-md py-4 sticky top-0 z-40">
        <nav class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex flex-col items-start">
                <a href="#home" class="text-3xl font-extrabold text-gray-900 logo">Happy2Nanal</a>
                <p class="text-gray-600 text-sm mt-1 subtitle">당신의 칼퇴를 응원합니다</p>
            </div>
            <ul class="flex space-x-8">
                <li><a href="#home" class="text-gray-700 hover:text-blue-600 font-medium text-lg transition-colors duration-200">HOME</a></li>
                <li><a href="#blog" class="text-gray-700 hover:text-blue-600 font-medium text-lg transition-colors duration-200">BLOG</a></li>
                <li><a href="#qa" class="text-gray-700 hover:text-blue-600 font-medium text-lg transition-colors duration-200">Q&A</a></li>
            </ul>
        </nav>
    </header>

    <div class="flex-1 container mx-auto px-4 py-10 flex flex-col lg:flex-row gap-10">
        <main id="main-content" role="main" class="flex-1 bg-white p-8 rounded-xl shadow-lg"></main>

        <aside class="w-full lg:w-80 space-y-8">
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h3 class="text-2xl font-bold text-gray-800 mb-5 border-b pb-3 border-gray-200">인기글</h3>
                <ul id="popular-posts-sidebar" class="space-y-4">
                    <li class="text-gray-700">인기글이 없습니다.</li>
                </ul>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h3 class="text-2xl font-bold text-gray-800 mb-5 border-b pb-3 border-gray-200">최신 글</h3>
                <ul id="latest-posts-sidebar" class="space-y-4">
                    <li class="text-gray-700">최신 글이 없습니다.</li>
                </ul>
            </div>
        </aside>
    </div>

    <div class="scroll-buttons fixed bottom-12 right-6 flex flex-col z-50">
        <button id="scrollUp" class="bg-blue-500 text-white p-3 mb-2 rounded-full shadow-lg hover:bg-blue-600 transition-colors text-xl">▲</button>
        <button id="scrollDown" class="bg-blue-500 text-white p-3 rounded-full shadow-lg hover:bg-blue-600 transition-colors text-xl">▼</button>
    </div>

    <footer id="footer" class="bg-gray-800 text-white text-center p-6 text-sm mt-auto shadow-inner" style="display: none;">
        <p>copyright ⓒ 2024 <strong>Happy2Nanal</strong> All Rights Reserved. |
        개인정보 처리방침 | 출판 및 사이트와 관련된 기타 문의는 게시판을 이용해주세요.</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
