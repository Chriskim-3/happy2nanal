<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy2Nanal</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="left-section">
                <a href="#home" class="logo-text">Happy2Nanal</a>
                <p class="subtitle">당신의 칼퇴를 응원합니다</p>
            </div>
            <ul>
                <li><a href="#home" class="nav-item">HOME</a></li>
                <li><a href="#blog" class="nav-item">BLOG</a></li>
                <li><a href="#qa" class="nav-item">Q&A</a></li>
                <li><a href="#notice" class="nav-item">공지사항</a></li>
            </ul>
        </nav>
    </header>

    <div id="main-content" role="main"></div>

    <div id="blog-detail-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-button" id="close-blog-detail">&times;</span>
            <h3 id="modal-blog-title"></h3>
            <div class="text-gray-600 text-sm mb-4">
                <span id="modal-blog-author"></span> | <span id="modal-blog-date"></span>
            </div>
            <div id="modal-blog-content" class="modal-post-content"></div>
        </div>
    </div>

    <div id="custom-modal-container" class="custom-modal-overlay hidden"></div>

    <div class="scroll-buttons">
        <button id="scrollUp">▲</button>
        <button id="scrollDown">▼</button>
    </div>

    <footer id="footer" style="display: none;">
        <p>copyright ⓒ 2024 <strong>Happy2Nanal</strong> All Rights Reserved. | 
        개인정보 처리방침 | 출판 및 사이트와 관련된 기타 문의는 게시판을 이용해주세요.</p>
    </footer>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
